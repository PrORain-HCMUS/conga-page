<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CONGA Slides · RecSys '26</title>
  <meta name="description" content="Slides of the ACM RecSys 2026 talk: CONGA: Continual Neural Gated Architecture for Long-History Sequential Recommendation.">
  <meta property="og:title" content="CONGA — RecSys '26 talk slides">
  <meta property="og:image" content="https://prorain-hcmus.github.io/conga-page/static/slides/slide-01.webp">
  <link rel="icon" type="image/x-icon" href="static/images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #1e293b; --muted: #64748b; --accent: #c65a35;
      --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; --dark: #1e293b;
    }
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.94);
      backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
    .bar { max-width: 1040px; margin: 0 auto; padding: .7rem 16px;
      display: flex; align-items: center; gap: .75rem; }
    .bar h1 { flex: 1; min-width: 0; margin: 0; font-size: 1rem; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar h1 span { color: var(--accent); }
    .btn { flex: none; display: inline-block; padding: .45rem .9rem; border-radius: 999px;
      font-size: .85rem; font-weight: 600; text-decoration: none; }
    .btn-dark { background: var(--dark); color: #fff; }
    .btn-dark:hover { background: #334155; }
    .btn-ghost { color: var(--muted); }
    .btn-ghost:hover { color: var(--text); }
    main { max-width: 1040px; margin: 0 auto; padding: 1.2rem 16px 3rem; }
    .intro { margin: .2rem 0 1.2rem; color: var(--muted); font-size: .9rem; line-height: 1.5; }
    figure { margin: 0 0 1.2rem; }
    figure img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, .07); }
    figcaption { margin-top: .35rem; text-align: right; font-size: .75rem; color: var(--muted); }
    footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 0 16px 2rem; }
    footer a { color: var(--muted); }
    @media (max-width: 560px) {
      .bar { gap: .4rem; }
      .bar h1 { font-size: .9rem; }
      .btn { padding: .4rem .7rem; font-size: .8rem; }
      figure { margin-bottom: .9rem; }
      figure img { border-radius: 6px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="btn btn-ghost" href="./" aria-label="Back to the CONGA project page">&larr; Project</a>
      <h1><span>CONGA</span> · RecSys '26 talk</h1>
      <a class="btn btn-dark" href="static/pdfs/CONGA-RecSys-slides.pdf" download>PDF</a>
    </div>
  </header>

  <main>
    <p class="intro">
      CONGA: Continual Neural Gated Architecture for Long-History Sequential Recommendation.
      Hoang-Vu Le, Tuong-Bach-Hy Nguyen, Bac Le &middot; ACM RecSys 2026, Minneapolis.
      Scroll to browse all 17 slides.
    </p>
    <div id="slides"></div>
  </main>

  <footer>
    <a href="./">Project page</a> &middot;
    <a href="https://dl.acm.org/doi/10.1145/3773078.3831761" target="_blank" rel="noopener">Paper (ACM DL)</a> &middot;
    <a href="https://github.com/nguyentuongbachhy/CONGA" target="_blank" rel="noopener">Code</a>
  </footer>

  <script>
    (function () {
      var N = 17, root = document.getElementById('slides'), html = '';
      for (var i = 1; i <= N; i++) {
        var n = (i < 10 ? '0' : '') + i;
        html += '<figure id="slide-' + i + '">' +
          '<img src="static/slides/slide-' + n + '.webp" width="1920" height="1080" alt="Slide ' + i + '"' +
          (i > 2 ? ' loading="lazy"' : '') + ' decoding="async">' +
          '<figcaption>' + i + ' / ' + N + '</figcaption></figure>';
      }
      root.innerHTML = html;
    })();
  </script>
  <noscript><p style="text-align:center">Enable JavaScript to view the slides, or <a href="static/pdfs/CONGA-RecSys-slides.pdf">download the PDF</a>.</p></noscript>
</body>
</html>
